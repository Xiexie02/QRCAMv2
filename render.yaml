services:
  - type: web
    name: qrcamv2
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_DRIVER
        value: supabase
      - key: SUPABASE_URL
        value: https://ejzlysntgphnizgiekui.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: adviser
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Manila
